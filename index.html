<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foogle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="app-container">
    <header>
      <div class="logo">Foogle</div>
      <div class="header-controls">
        <button id="high-score-btn" class="icon-btn" aria-label="High Scores">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 15l-2 5l9-9l-9-9l2 5l-9 9l9 9z" />
          </svg>
        </button>
        <button id="settings-btn" class="icon-btn" aria-label="Settings">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
            </path>
          </svg>
        </button>
      </div>
    </header>

    <main>
      <div class="game-info-bar">
        <div class="timer-container">
          <span class="label">Time</span>
          <span id="timer-display">03:00</span>
        </div>
        <div class="score-container">
          <span class="label">Score</span>
          <span id="score-display">0</span>
        </div>
      </div>

      <div class="board-container">
        <div id="game-board" class="game-board">
          <!-- Grid cells will be generated here -->
        </div>
        <div id="rotate-controls" class="rotate-controls">
          <button id="rotate-btn" class="secondary-btn" title="Rotate Board">
            Rotate Board ⟳
          </button>
        </div>
      </div>

      <div class="current-word-display">
        <span id="current-word"></span>
        <span id="word-validation-icon"></span>
      </div>

      <div class="action-buttons">
        <button id="submit-word-btn" class="primary-btn" disabled>Submit Word</button>
        <button id="new-game-btn" class="secondary-btn">New Game</button>
      </div>

      <div class="found-words-list">
        <h3>Found Words</h3>
        <div id="words-list" class="words-scroll-area"></div>
      </div>
    </main>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Settings</h2>
      <div class="setting-item">
        <label for="theme-select">Theme</label>
        <select id="theme-select">
          <option value="light">Glass Light</option>
          <option value="dark">Glass Dark</option>
          <option value="neon">Neon Night</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="timer-select">Timer Duration</label>
        <select id="timer-select">
          <option value="60">1 Minute</option>
          <option value="120">2 Minutes</option>
          <option value="180" selected>3 Minutes</option>
          <option value="300">5 Minutes</option>
          <option value="0">Unlimited</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="min-length-select">Minimum Word Length</label>
        <select id="min-length-select">
          <option value="3" selected>3 Letters</option>
          <option value="4">4 Letters</option>
        </select>
      </div>
      <div class="setting-item">
        <label for="dice-type-select">Dice Distribution</label>
        <select id="dice-type-select">
          <option value="new" selected>New / Modern</option>
          <option value="classic">Classic (Pre-1987)</option>
        </select>
      </div>
      <div class="setting-item checkbox-item">
        <label for="random-orientation">Random Letter Orientation</label>
        <input type="checkbox" id="random-orientation">
        <small>Letters will point in random cardinal directions</small>
      </div>

      <div class="modal-actions">
        <button id="close-settings-btn" class="primary-btn">Done</button>
      </div>
    </div>
  </div>

  <!-- High Scores Modal -->
  <div id="high-scores-modal" class="modal hidden">
    <div class="modal-content">
      <h2>High Scores</h2>
      <ul id="high-scores-list">
        <!-- Scores injected here -->
      </ul>
      <div class="modal-actions">
        <button id="close-scores-btn" class="primary-btn">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
